# Compositional contract override for the VERIFIED case.
#
# When proving `double_plus_one` (Cryptol `double_plus_one_spec`), install
# the proven contract `double_it_spec` for the cross-TU callee `double_it`
# via `llvm_unsafe_assume_spec` instead of the default havoc extern model.
# `double_it` has C linkage, so its implementation symbol is just its name.

[functions.double_plus_one_spec]
compose = [{ cryptol_fn = "double_it_spec", symbol = "double_it" }]
combine_scope = "callgraph"
